<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despesas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="theme-color" content="#E6EEF5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDE9; --surface:#F7F9F7; --ink:#17231D; --muted:#5E6E65; --line:#CBD5CF;
  --accent:#2E5E4E; --accent-ink:#FFFFFF; --debt:#A23B2A; --bar:#BFD3C8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121814; --surface:#1B231E; --ink:#E4ECE6; --muted:#93A399; --line:#2E3A33;
    --accent:#7FB59E; --accent-ink:#0F1A15; --debt:#E58A73; --bar:#2F4A3E;
  }
}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1B231E; --ink:#E4ECE6; --muted:#93A399; --line:#2E3A33;
  --accent:#7FB59E; --accent-ink:#0F1A15; --debt:#E58A73; --bar:#2F4A3E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{padding:12px 4px 22px}
.hero p{margin:0;color:var(--muted);font-size:1rem}
.owed{font-size:clamp(3rem,15vw,4.6rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0 4px;color:var(--debt)}
.owed.zero{color:var(--ok,var(--accent))}
.store{font-size:.8rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px;border-radius:9px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}

.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px}
.amount input{border:0;background:none;font-size:2.4rem;font-weight:700;width:100%;padding:4px 0;outline:none}
.amount span{font-size:1.6rem;color:var(--muted);font-weight:500}
.amount:focus-within{border-color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#ordem{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#ordem button{padding:7px 4px;font-size:.82rem;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:12px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.primary{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px;font-weight:700;font-size:1rem}
.primary:disabled{opacity:.45;cursor:default}
.msg{min-height:1.2em;font-size:.85rem;color:var(--muted);margin:8px 0 0;text-align:center}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 10px}
.monthnav h2{margin:0;font-size:1.35rem;font-weight:700;text-transform:none}
.monthnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:1.2rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.45rem;font-weight:700}
.stat small{color:var(--muted);font-size:.85rem}

h3{font-size:1rem;margin:0 0 10px;font-weight:700}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:11px}
.cat .n{font-weight:500}
.cat .v{text-align:right}
.cat .track{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.cat .fill{height:100%;background:var(--accent);border-radius:4px}
.cat .dt{color:var(--muted);font-size:.8rem;font-weight:400}
.cat .x{border:0;background:none;color:var(--muted);font-size:1.15rem;margin-left:6px;padding:4px 8px;min-width:36px;min-height:32px;border-radius:8px}
.x.armed,.mv button.armed{background:var(--debt);color:#fff;font-size:.8rem;font-weight:700}
.cat .x:hover{color:var(--debt)}
.cat .pct{color:var(--muted);font-size:.85rem;margin-left:6px}
.empty{color:var(--muted);font-size:.95rem;margin:4px 0}

.mv{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0}
.mv .d{color:var(--muted);font-size:.85rem}
.mv .t{min-width:0}
.mv .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .t small{color:var(--muted);font-size:.8rem}
.mv .a{font-weight:700;text-align:right}
.mv .a.in{color:var(--accent)}
.mv button{border:0;background:none;color:var(--muted);font-size:1.1rem;border-radius:8px;height:32px}
.mv button:hover{color:var(--debt)}
.export{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;width:100%;font-weight:500;margin-top:4px}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.cat .fill{transition:width .35s ease}}
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.temas button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-size:.8rem;min-width:0}
.temas button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.temas i{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.temas span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script>
/* ---------- temas de cores ---------- */
const TEMAS={
 salvia:{nome:"Sálvia",bg:"#E8EDE9",surface:"#F7F9F7",ink:"#17231D",muted:"#5E6E65",line:"#CBD5CF",accent:"#2E5E4E","accent-ink":"#FFFFFF",debt:"#A23B2A",ok:"#2E7D4F"},
 oceano:{nome:"Oceano",bg:"#E6EEF5",surface:"#F7FAFD",ink:"#12202E",muted:"#5A6B7C",line:"#C9D6E3",accent:"#1F5A8C","accent-ink":"#FFFFFF",debt:"#B3372E",ok:"#1E8A5A"},
 lavanda:{nome:"Lavanda",bg:"#EEEAF5",surface:"#FAF8FD",ink:"#221A30",muted:"#6B6180",line:"#D6CEE6",accent:"#5B3F9E","accent-ink":"#FFFFFF",debt:"#B8324A",ok:"#2C8A5E"},
 terracota:{nome:"Terracota",bg:"#F4ECE3",surface:"#FCF8F3",ink:"#2B1E15",muted:"#7A6555",line:"#E3D4C4",accent:"#B4532A","accent-ink":"#FFFFFF",debt:"#A8261F",ok:"#3F7D3A"},
 rosa:{nome:"Rosa",bg:"#F7E9EE",surface:"#FFF8FA",ink:"#2E1720",muted:"#80606C",line:"#EBCFD9",accent:"#C23B6E","accent-ink":"#FFFFFF",debt:"#B0262E",ok:"#2F8A5B"},
 noite:{nome:"Noite",escuro:1,bg:"#121814",surface:"#1B231E",ink:"#E4ECE6",muted:"#93A399",line:"#2E3A33",accent:"#7FB59E","accent-ink":"#0F1A15",debt:"#E58A73",ok:"#7FD1A0"},
 grafite:{nome:"Grafite",escuro:1,bg:"#18181B",surface:"#232326",ink:"#F2F2F0",muted:"#A1A1A6",line:"#35353A",accent:"#F2C230","accent-ink":"#18181B",debt:"#FF6B5B",ok:"#5FD68A"},
 menta:{nome:"Menta",bg:"#E4F4EF",surface:"#F7FCFA",ink:"#0F2A24",muted:"#557069",line:"#C3E3D9",accent:"#0E8C73","accent-ink":"#FFFFFF",debt:"#C0392B",ok:"#0E8C73"}
};
const TEMA_LS="despesas-tema", TEMA_PADRAO="oceano";
function aplicarTema(id){
  const t=TEMAS[id]||TEMAS[TEMA_PADRAO], st=document.documentElement.style;
  ["bg","surface","ink","muted","line","accent","accent-ink","debt","ok"].forEach(k=>t[k]?st.setProperty("--"+k,t[k]):st.removeProperty("--"+k));
  st.colorScheme=t.bg?(t.escuro?"dark":"light"):"";
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content=t.bg||getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#E8EDE9";
}
try{aplicarTema(localStorage.getItem(TEMA_LS))}catch(e){aplicarTema(TEMA_PADRAO)}
</script>
</head>
<body>
<main>
  <section class="hero">
    <div class="owed" id="owed">0,00 €</div>
    <div class="store" id="store">A carregar…</div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-mode="despesa">Despesa</button>
      <button role="tab" aria-selected="false" data-mode="pagamento">Dinheiro recebido</button>
    </div>
    <label class="amount"><input id="val" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Valor"><span>€</span></label>
    <div class="row">
      <input class="field" id="desc" placeholder="Descrição (ex.: passe)" aria-label="Descrição" autocomplete="off">
      <input class="field" id="date" type="date" aria-label="Data">
    </div>
    <button class="primary" id="add">Adicionar despesa</button>
    <p class="msg" id="msg"></p>
  </section>

  <div class="monthnav">
    <button id="prev" aria-label="Mês anterior">‹</button>
    <h2 id="mlabel"></h2>
    <button id="next" aria-label="Mês seguinte">›</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="sGasto">0,00 €</b><small>gastaste</small></div>
    <div class="stat"><b id="sRec">0,00 €</b><small>dinheiro recebido</small></div>
  </div>

  <section class="card">
    <h3>Despesas do mês</h3>
    <div class="chips" id="ordem" role="group" aria-label="Ordenar">
      <button data-ordem="valor">Maior valor</button>
      <button data-ordem="recentes">Mais recentes</button>
      <button data-ordem="antigas">Mais antigas</button>
    </div>
    <div id="list"></div>
  </section>

  <section class="card" id="paycard" hidden>
    <h3>Dinheiro recebido</h3>
    <div id="pays"></div>
  </section>

  <button class="export" id="export" hidden>Exportar mês para Excel (CSV)</button>
  <button class="export" id="importBtn">Importar despesas (CSV)</button>
  <input type="file" id="import" accept=".csv,.txt,text/csv,text/plain" hidden>
  <div class="bk">
    <button class="export" id="backup">Guardar cópia de segurança</button>
    <button class="export" id="restoreBtn">Restaurar cópia</button>
    <input type="file" id="restore" accept=".json,application/json" hidden>
  </div>

  <section class="card" style="margin-top:14px">
    <h3>Cores da app</h3>
    <div class="temas" id="temas"></div>
  </section>
</main>

<script>
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};

let items=[];           // {id,tipo,data,desc,cat,valor}
let mode="despesa";
let month=today().slice(0,7);
let backend=null;
let ordem="valor";      // valor | recentes | antigas
try{ordem=localStorage.getItem("despesas-ordem")||"valor"}catch(e){}       // {save(item),remove(id)}

/* ---------- UI setup ---------- */
$("date").value=today();
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("desc").placeholder=mode==="despesa"?"Descrição (ex.: passe)":"Nota (opcional)";
  $("add").textContent=mode==="despesa"?"Adicionar despesa":"Registar dinheiro recebido";
});
document.querySelectorAll("#ordem button").forEach(b=>b.onclick=()=>{
  ordem=b.dataset.ordem; try{localStorage.setItem("despesas-ordem",ordem)}catch(e){} render();
});
$("prev").onclick=()=>shift(-1); $("next").onclick=()=>shift(1);
function shift(k){let [y,m]=month.split("-").map(Number);m+=k;if(m<1){m=12;y--}if(m>12){m=1;y++}month=`${y}-${pad(m)}`;render()}

function flash(t){$("msg").textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>$("msg").textContent="",2500)}

$("add").onclick=async()=>{
  const v=parseFloat(($("val").value||"").replace(/\s/g,"").replace(",","."));
  if(!(v>0)){flash("Escreve um valor maior que zero.");$("val").focus();return}
  if(!$("date").value){flash("Escolhe a data.");return}
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo:mode,data:$("date").value,
    desc:$("desc").value.trim(),valor:Math.round(v*100)/100};
  $("add").disabled=true;
  try{
    await backend.save(it);
    $("val").value="";$("desc").value="";
    month=it.data.slice(0,7);
    flash(mode==="despesa"?"Despesa adicionada.":"Dinheiro recebido registado.");
  }catch(e){flash("Não foi possível guardar. Tenta outra vez.")}
  $("add").disabled=false; render();
};
$("val").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});

/* ---------- render ---------- */
function render(){
  const gasto=items.filter(i=>i.tipo==="despesa").reduce((s,i)=>s+i.valor,0);
  const pago=items.filter(i=>i.tipo==="pagamento").reduce((s,i)=>s+i.valor,0);
  const owed=Math.round((gasto-pago)*100)/100;
  $("owed").textContent=eur(Math.abs(owed)); $("owed").classList.toggle("zero",owed<=0);

  const [y,m]=month.split("-").map(Number);
  $("mlabel").textContent=`${MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)} ${y}`;
  const mi=items.filter(i=>i.data.startsWith(month)).sort((a,b)=>b.data.localeCompare(a.data));
  const mg=mi.filter(i=>i.tipo==="despesa"), mp=mi.filter(i=>i.tipo==="pagamento");
  const tg=mg.reduce((s,i)=>s+i.valor,0);
  $("sGasto").textContent=eur(tg); $("sRec").textContent=eur(mp.reduce((s,i)=>s+i.valor,0));

  const del=async(i,btn)=>{
    if(!btn.dataset.armed){
      btn.dataset.armed="1"; btn.textContent="Apagar?"; btn.classList.add("armed");
      setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent="×";btn.classList.remove("armed")}},3000);
      return;
    }
    btn.disabled=true;
    try{await backend.remove(i.id);flash("Apagado.")}catch(e){flash("Não foi possível apagar. Tenta outra vez.")}
    render();
  };
  const L=$("list"); L.innerHTML="";
  if(!mg.length) L.innerHTML='<p class="empty">Ainda não há despesas neste mês.</p>';
  const pos=i=>items.indexOf(i);
  const cmp={valor:(a,b)=>b.valor-a.valor||pos(b)-pos(a),
    recentes:(a,b)=>b.data.localeCompare(a.data)||pos(b)-pos(a),
    antigas:(a,b)=>a.data.localeCompare(b.data)||pos(a)-pos(b)}[ordem]||((a,b)=>b.valor-a.valor);
  document.querySelectorAll("#ordem button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ordem===ordem));
  [...mg].sort(cmp).forEach(i=>{
    const p=tg?i.valor/tg:0, d=document.createElement("div");d.className="cat";
    d.innerHTML=`<span class="n"><span class="nm"></span> <small class="dt">${i.data.slice(8)}/${i.data.slice(5,7)}</small></span><span class="v">${eur(i.valor)}<span class="pct">${(p*100).toFixed(1).replace(".",",")}%</span><button class="x" aria-label="Apagar">×</button></span><div class="track"><div class="fill" style="width:${(p*100).toFixed(1)}%"></div></div>`;
    d.querySelector(".nm").textContent=i.desc||"Sem descrição";
    const xb=d.querySelector(".x"); xb.onclick=()=>del(i,xb);
    L.appendChild(d);
  });
  const P=$("pays"); P.innerHTML=""; $("paycard").hidden=!mp.length;
  mp.forEach(i=>{
    const r=document.createElement("div");r.className="mv";
    r.innerHTML=`<span class="d">${i.data.slice(8)}/${i.data.slice(5,7)}</span><span class="t"><div></div></span><span class="a in">−${eur(i.valor)}</span><button aria-label="Apagar">×</button>`;
    r.querySelector(".t div").textContent=i.desc||"Dinheiro recebido";
    const pb=r.querySelector("button"); pb.onclick=()=>del(i,pb);
    P.appendChild(r);
  });
}

/* ---------- storage ---------- */
const LS="conta-pais-v1";
function persistAll(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){flash("Não foi possível guardar neste dispositivo.")}}
function localBackend(){
  try{items=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){items=[]}
  const persist=persistAll;
  return{save:async it=>{items.push(it);persist()},remove:async id=>{items=items.filter(i=>i.id!==id);persist()}};
}
backend=localBackend();
$("store").textContent="Guardado neste telemóvel";
render();

/* ---------- ficheiros ---------- */
async function saveFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{
    const f=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
$("export").hidden=false;
$("export").onclick=()=>{
  const mi=items.filter(i=>i.data.startsWith(month)).sort((a,b)=>a.data.localeCompare(b.data));
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const fd=d=>`${d.slice(8)}/${d.slice(5,7)}/${d.slice(0,4)}`;
  const num=v=>v.toFixed(2).replace(".",",");
  let csv="Data;Descrição;Valor (€)\n"+mi.filter(i=>i.tipo==="despesa").map(i=>[fd(i.data),q(i.desc),num(i.valor)].join(";")).join("\n");
  const p=mi.filter(i=>i.tipo==="pagamento");
  if(p.length) csv+="\n\nDinheiro recebido\nData;Valor recebido (€);Notas\n"+p.map(i=>[fd(i.data),num(i.valor),q(i.desc)].join(";")).join("\n");
  saveFile(`despesas-${month}.csv`,"\uFEFF"+csv,"text/csv");
};
$("backup").onclick=()=>saveFile(`despesas-backup-${today()}.json`,JSON.stringify(items),"application/json");
$("restoreBtn").onclick=()=>$("restore").click();
$("restore").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data)||data.some(i=>!i.id||!i.data||typeof i.valor!=="number")) throw 0;
    items=data; persistAll(); render(); flash("Cópia restaurada.");
  }catch(err){flash("Esse ficheiro não é uma cópia válida.")}
  e.target.value="";
};
/* ---------- importar CSV ---------- */
function splitCSV(line,sep){
  const out=[];let cur="",q=false;
  for(let k=0;k<line.length;k++){
    const c=line[k];
    if(q){if(c==='"'){if(line[k+1]==='"'){cur+='"';k++}else q=false}else cur+=c}
    else if(c==='"')q=true; else if(c===sep){out.push(cur);cur=""} else cur+=c;
  }
  out.push(cur);return out.map(x=>x.trim());
}
function parseData(t){
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/);
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];if(+m[2]>=1&&+m[2]<=12&&+m[1]>=1&&+m[1]<=31)return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
  return null;
}
function parseValor(t){
  t=t.replace(/[€\s ]/g,"").replace(/^−/,"-");
  if(!/^-?[\d.,]+$/.test(t))return NaN;
  if(t.includes(",")&&t.includes(".")) t=t.lastIndexOf(",")>t.lastIndexOf(".")?t.replace(/\./g,"").replace(",","."):t.replace(/,/g,"");
  else if(t.includes(",")) t=t.replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,"");
  return parseFloat(t);
}
function parseImport(text){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/);
  const first=lines.find(l=>l.trim())||"";
  const sep=first.includes(";")?";":first.includes("\t")?"\t":",";
  let tipo="despesa",cols=null,bad=0;const res=[];
  for(const raw of lines){
    if(!raw.trim())continue;
    const c=splitCSV(raw,sep), low=c.map(x=>x.toLowerCase());
    if(c.length===1&&/recebid/.test(low[0])){tipo="pagamento";cols=null;continue}
    const iD=low.findIndex(x=>/^(data|date)/.test(x)), iV=low.findIndex(x=>/valor|montante|quantia|pre[cç]o|amount|value|price/.test(x));
    if(iD>=0&&iV>=0){
      cols={d:iD,v:iV,t:low.findIndex((x,k)=>k!==iD&&k!==iV&&/descri|nota|detalhe|nome|note|name/.test(x))};
      if(low.some(x=>/recebid/.test(x)))tipo="pagamento";
      continue;
    }
    let d,v,t;
    if(cols){d=parseData(c[cols.d]||"");v=parseValor(c[cols.v]||"");t=cols.t>=0?c[cols.t]||"":""}
    else{
      const kd=c.findIndex(x=>parseData(x)), kv=c.findIndex((x,k)=>k!==kd&&!isNaN(parseValor(x)));
      d=kd>=0?parseData(c[kd]):null; v=kv>=0?parseValor(c[kv]):NaN;
      t=c.filter((x,k)=>k!==kd&&k!==kv&&x).join(" ");
    }
    if(!d||!(Math.abs(v)>0)){bad++;continue}
    res.push({tipo:v<0&&tipo==="despesa"?"pagamento":tipo,data:d,desc:t,valor:Math.round(Math.abs(v)*100)/100});
  }
  return{res,bad};
}
$("importBtn").onclick=()=>$("import").click();
$("import").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const {res,bad}=parseImport(await f.text());
    if(!res.length) throw 0;
    // ignora linhas que já existem (ex.: importar o mesmo ficheiro duas vezes)
    const key=i=>[i.tipo,i.data,i.desc,i.valor].join("|"), have={};
    items.forEach(i=>have[key(i)]=(have[key(i)]||0)+1);
    let add=0,dup=0;
    res.forEach((it,k)=>{
      const kk=key(it);
      if(have[kk]){have[kk]--;dup++;return}
      items.push({id:Date.now().toString(36)+k.toString(36)+Math.random().toString(36).slice(2,6),...it});add++;
    });
    persistAll();
    if(add) month=res[res.length-1].data.slice(0,7);
    render();
    $("msg").scrollIntoView({block:"center",behavior:"smooth"});
    flash(`${add} importad${add===1?"a":"as"}`+(dup?`, ${dup} já existia${dup===1?"":"m"}`:"")+(bad?`, ${bad} linha${bad===1?"":"s"} ignorada${bad===1?"":"s"}`:"")+".");
  }catch(err){flash("Não encontrei despesas nesse ficheiro.")}
  e.target.value="";
};
/* ---------- escolher cores ---------- */
(()=>{
  let atual; try{atual=localStorage.getItem(TEMA_LS)}catch(e){}
  if(!TEMAS[atual]) atual=TEMA_PADRAO;
  const box=$("temas");
  Object.entries(TEMAS).forEach(([id,t])=>{
    const b=document.createElement("button");
    b.dataset.tema=id; b.setAttribute("aria-pressed",id===atual);
    const cor=`background:linear-gradient(135deg,${t.bg} 50%,${t.accent} 50%)`;
    b.innerHTML=`<i style="${cor}"></i><span>${t.nome}</span>`;
    b.onclick=()=>{
      aplicarTema(id);
      try{localStorage.setItem(TEMA_LS,id)}catch(e){}
      box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    };
    box.appendChild(b);
  });
})();
